<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KARAOKE STUDIO</title>
<style>
:root{--bg:#16171b;--tx:#e8e9ee;--mu:#8b90a0;--ac:#8b7cff;--cy:#4fd8f0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:24px}
.logo{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:conic-gradient(from 200deg,var(--ac),var(--cy),var(--ac));display:grid;place-items:center}
.logo:after{content:"";width:18px;height:18px;border-radius:50%;background:var(--bg)}
p{margin:0 0 28px;color:var(--mu)}
a.btn{display:inline-block;padding:14px 36px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:18px;letter-spacing:.06em;text-decoration:none;transition:filter .15s,transform .15s}
a.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
a.btn:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
</style></head>
<body>
<main>
 <div class="logo" aria-hidden="true"></div>
 <p>Karaoke Video Creator</p>
 <a class="btn" href="https://pariyessomparn.github.io/allweb/KARAOKE%20STUDIO.html">KARAOKE STUDIO</a>
</main>
</body></html>
